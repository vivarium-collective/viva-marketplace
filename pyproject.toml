[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viva-marketplace"
version = "0.1.0"
description = "Ecosystem ledger for the vivarium / process-bigraph workbench: the registry of repos + an aggregated artifact index."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vivarium Collective" }]
keywords = ["vivarium", "process-bigraph", "workbench", "marketplace"]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-jsonschema",
    "types-pyyaml",
]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-marketplace"

[project.scripts]
viva-marketplace-selfcheck = "viva_marketplace.selfcheck:main"

[tool.hatch.build.targets.wheel]
packages = ["viva_marketplace"]

# Ship the ledger data files + schemas inside the wheel so consumers can read
# them via viva_marketplace.load_modules() / load_ecosystem_index() /
# load_composability_graph(), and so `jsonschema.validate(..., schema=...)`
# works from an installed package without needing a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"viva_marketplace/modules.json" = "viva_marketplace/modules.json"
"viva_marketplace/ecosystem-index.json" = "viva_marketplace/ecosystem-index.json"
"viva_marketplace/composability-graph.json" = "viva_marketplace/composability-graph.json"
"viva_marketplace/schemas" = "viva_marketplace/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter/line-length above, not worth blocking on
]

[tool.mypy]
python_version = "3.10"
files = ["viva_marketplace", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

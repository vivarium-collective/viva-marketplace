name: Build ecosystem index

# Discovers the registry from every public, non-archived vivarium-collective
# repo carrying the viva-marketplace GitHub topic, refreshing modules.json;
# then clones and scans each repo's source into ecosystem-index.json +
# composability-graph.json. Commits all three back to main and publishes them
# to gh-pages so any published workbench can fetch them same-origin.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # daily
  push:
    branches: [main]
    paths:
      - "viva_marketplace/modules.json"
      - "viva_marketplace/scanner.py"
      - "viva_marketplace/composability.py"
      - "scripts/build_ecosystem_index.py"

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (PyYAML for spec scanning, jsonschema to validate the build output)
        run: python -m pip install --quiet pyyaml jsonschema

      - name: Discover repos (viva-marketplace topic) + clone/scan → index + composability graph
        env:
          # discovery queries the org for public repos with the viva-marketplace
          # topic; the default workflow token authenticates the search API.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_ecosystem_index.py --jobs 8

      - name: Validate generated files against their schemas
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator

          for data_file, schema_file in [
              ("viva_marketplace/ecosystem-index.json", "viva_marketplace/schemas/ecosystem-index.schema.json"),
              ("viva_marketplace/composability-graph.json", "viva_marketplace/schemas/composability-graph.schema.json"),
          ]:
              data = json.load(open(data_file))
              schema = json.load(open(schema_file))
              Draft202012Validator(schema).validate(data)
              print(f"OK: {data_file}")
          PY

      - name: Commit the refreshed registry + index + graph (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add viva_marketplace/modules.json viva_marketplace/ecosystem-index.json viva_marketplace/composability-graph.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh registry (topic discovery) + ecosystem-index + composability-graph [skip ci]"
            git push
          else
            echo "registry + index + graph unchanged"
          fi

      - name: Assemble the public ledger (modules + index + graph)
        run: |
          mkdir -p public
          cp viva_marketplace/modules.json public/modules.json
          cp viva_marketplace/ecosystem-index.json public/ecosystem-index.json
          cp viva_marketplace/composability-graph.json public/composability-graph.json

      - name: Publish ledger to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false

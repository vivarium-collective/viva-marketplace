name: Validate registry

# Schema-validates modules.json whenever a PR touches it, its schema, or the
# validator itself — a sanity check on the (now topic-discovered, not
# hand-edited) registry, catching a bad manual fix or a schema regression
# before merge. Publishing a repo to the marketplace doesn't touch this file
# directly — see CONTRIBUTING.md.
on:
  pull_request:
    paths:
      - "viva_marketplace/modules.json"
      - "viva_marketplace/schemas/modules.schema.json"
      - "scripts/validate_modules.py"

permissions:
  contents: read

concurrency:
  group: validate-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python -m pip install --quiet jsonschema
      - name: Validate modules.json
        run: python scripts/validate_modules.py

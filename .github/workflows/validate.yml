name: Validate registry

# PR gate: any change to the repo registry (modules.json) or its schema is
# validated before it can merge. Adding/updating a repo goes through a pull
# request — see CONTRIBUTING.md.
on:
  pull_request:
    paths:
      - "viva_marketplace/modules.json"
      - "viva_marketplace/schemas/modules.schema.json"
      - "scripts/validate_modules.py"

permissions:
  contents: read

concurrency:
  group: validate-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python -m pip install --quiet jsonschema
      - name: Validate modules.json
        run: python scripts/validate_modules.py
